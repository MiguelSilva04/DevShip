name: CI

on:
  push:
    branches: [principal]
  pull_request:
    branches: [principal]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: devship
          POSTGRES_PASSWORD: devship
          POSTGRES_DB: devship_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+psycopg2://devship:devship@localhost:5432/devship_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --no-cache-dir -r requirements-dev.txt

      - run: pytest
