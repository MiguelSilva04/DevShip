services:
  postgres:
    image: postgres:17
    container_name: devship-postgres
    environment:
      POSTGRES_USER: devship
      POSTGRES_PASSWORD: devship
      POSTGRES_DB: devship_dev
    ports:
      - "5433:5432"
    volumes:
      - devship-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devship -d devship_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: devship-backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://devship:devship@postgres:5432/devship_dev
    volumes:
      - ./backend:/app/backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: devship-frontend
    environment:
      BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      - devship-frontend-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  devship-postgres-data:
  devship-frontend-node-modules:
